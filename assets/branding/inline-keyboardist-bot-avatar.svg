<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
    <title>Inline Keyboardist Bot avatar</title>
    <defs>
        <linearGradient id="brand" x1="130" y1="96" x2="900" y2="928" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3390EC" />
            <stop offset="0.61" stop-color="#3390EC" />
            <stop offset="0.611" stop-color="#31B545" />
            <stop offset="1" stop-color="#31B545" />
        </linearGradient>
        <clipPath id="avatar-crop">
            <circle cx="512" cy="512" r="512" />
        </clipPath>
    </defs>

    <g clip-path="url(#avatar-crop)">
        <rect width="1024" height="1024" fill="url(#brand)" />
        <circle cx="512" cy="512" r="491" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="18" />
    </g>

    <g stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
        <rect x="264" y="264" width="496" height="496" rx="72" />
        <path d="M264 430H760" />
        <path d="M264 594H760" />
    </g>
</svg>
